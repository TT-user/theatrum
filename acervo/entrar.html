<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acervo · Theatrum</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<style>
  :root{--bg:#0B0A08;--card:#1A1815;--line:#2A2620;--accent:#E3B341;--accent-soft:#F0D488;--muted:#A39B8D;--cream:#F6F1E7;--danger:#D64545}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--cream);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:grid;place-items:center;padding:24px 16px}
  form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 24px;text-align:center}
  img{width:56px;height:56px;border-radius:50%}
  h1{font:800 22px/1.2 "Plus Jakarta Sans",Inter,system-ui,sans-serif;margin:16px 0 6px}
  p{color:var(--muted);font-size:15px}
  label{display:block;text-align:left;font-size:14px;color:var(--muted);margin:24px 0 8px}
  input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:#100E0B;color:var(--cream);
    font:500 17px Inter,system-ui,sans-serif;padding:0 14px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{width:100%;height:50px;margin-top:14px;border:0;border-radius:999px;background:var(--accent);color:#150F03;
    font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
  button:hover{background:var(--accent-soft)}
  .erro{color:var(--danger);font-size:14px;margin-top:12px;min-height:21px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <img src="/assets/img/logo.webp" width="192" height="192" alt="Theatrum">
  <h1>Acervo Theatrum</h1>
  <p>Área restrita.</p>
  <label for="senha">Senha</label>
  <input id="senha" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Entrar</button>
  <p class="erro" id="erro" role="alert"></p>
</form>
<script>
(function () {
  'use strict';
  var COOKIE = 'theatrum_acervo';
  var erro = document.getElementById('erro');
  /* este arquivo aparece no lugar de qualquer página do /acervo/ enquanto não há
     a chave certa: se acabou de tentar e voltou aqui, a senha estava errada */
  try {
    if (sessionStorage.getItem('acervo-tentou')) {
      sessionStorage.removeItem('acervo-tentou');
      erro.textContent = 'Senha errada. Tente de novo.';
      document.cookie = COOKIE + '=; path=/; max-age=0';
    }
  } catch (e) {}

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var senha = document.getElementById('senha').value.trim();
    if (!senha) return;
    var dados = new TextEncoder().encode('theatrum-acervo:' + senha);
    crypto.subtle.digest('SHA-256', dados).then(function (buf) {
      var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
      /* um ano, no domínio inteiro: as prévias desativadas leem o mesmo cookie */
      document.cookie = COOKIE + '=' + hex + '; path=/; max-age=31536000; samesite=lax' +
        (location.protocol === 'https:' ? '; secure' : '');
      try { sessionStorage.setItem('acervo-tentou', '1'); } catch (e) {}
      /* no próprio entrar.html, segue para o acervo; em outra página, recarrega ela */
      if (/entrar\.html$/.test(location.pathname)) location.replace('/acervo/');
      else location.reload();
    });
  });
})();
</script>
</body>
</html>
